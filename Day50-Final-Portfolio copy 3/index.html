<!DOCTYPE html>
<html>
<head>
  <title>KT Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<nav id="navbar">
  <div class="logo">KT</div>
  <div class="menu-toggle" id="menuToggle">☰</div>
  <ul id="navLinks">
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section id="home" class="hero">
  <h1>Hi, I'm KT</h1>
  <p>Web Developer | MCA Student</p>
  <button id="projectBtn">View Projects</button>
</section>

<section id="about" class="section hidden">
  <h2>About</h2>
  <p>Focused on Web Dev, DSA, and building strong fundamentals.</p>
</section>

<section id="projects" class="section hidden">
  <h2>Projects</h2>

  <div class="filters">
    <button data-filter="all">All</button>
    <button data-filter="js">JavaScript</button>
    <button data-filter="ui">UI</button>
  </div>

  <div class="project-grid">

    <div class="card" data-category="js">Task Manager</div>
    <div class="card" data-category="js">User Search</div>
    <div class="card" data-category="ui">Landing Page</div>

  </div>
</section>

<section id="contact" class="section hidden">
  <h2>Contact</h2>
  <form id="form">
    <input type="text" placeholder="Name" id="name">
    <input type="email" placeholder="Email" id="email">
    <textarea placeholder="Message" id="msg"></textarea>
    <button type="submit">Send</button>
    <p id="error"></p>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>

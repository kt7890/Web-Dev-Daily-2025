<!DOCTYPE html>
<html>
<head>
  <title>Project Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="projects">
    <h2>My Projects</h2>

    <div class="filters">
      <button data-filter="all">All</button>
      <button data-filter="js">JavaScript</button>
      <button data-filter="ui">UI</button>
    </div>

    <div class="project-grid">

      <div class="card" data-category="js">Task Manager</div>
      <div class="card" data-category="js">User Search</div>
      <div class="card" data-category="ui">Landing Page</div>
      <div class="card" data-category="ui">Pricing UI</div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
